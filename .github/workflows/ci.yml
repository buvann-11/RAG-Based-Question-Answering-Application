name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (without the heavy embedding model stack)
        run: |
          grep -v '^sentence-transformers' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt pytest httpx
      - name: Run tests
        run: python -m pytest -v tests
